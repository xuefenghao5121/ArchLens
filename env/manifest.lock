# 环境版本锁（重建凭据；与 COMPILER_VERSION.txt / deliverables/dev/build-instructions.md 同步）
host_base: Ubuntu 24.04 (x86_64)
compiler: {gpp: 13.3.0, binutils_aarch64: 2.42}
python: 3.12
build_tools: {scons: 4.10.1, cmake: 4.3.1}
rtl_chain: {pycircuit: 6.1.0 (toolchain/pycircuit-sdk, 未修改), verilator: 5.050 (toolchain/verilator, 未修改)}
simulator: {gem5: v26.0.0.0, git_head: fed0e07e930f, patch: deliverables/dev/gem5-patch/, build: build/ARM_glm}
kernel: {linux: 6.18.63 ARM64_SME=y initramfs 内建, build: fs/build/linux-6.18.63}
qemu: {qemu_aarch64: 11.1.3 linux-user, build: fs/build/qemu-11.1.3/build-user}
abi_rule: gem5 / Verilator .so / SimObject 必须同编译器族构建
