<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>可视化 Agent 工作流</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171e2e; --panel2: #1f2940;
    --text: #d7e0f0; --muted: #7d8aa5; --line: #2a3550;
    --green: #34d399; --red: #f87171; --yellow: #fbbf24;
    --blue: #60a5fa; --purple: #a78bfa; --orange: #fb923c;
    --gray: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    font-size: 13px;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px; background: var(--panel);
    border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  .toolbar { display: flex; gap: 8px; align-items: center; }
  select, button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #26345a; }
  .summary {
    display: flex; gap: 14px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .stat { background: var(--panel2); border-radius: 8px; padding: 8px 14px; min-width: 110px; }
  .stat .k { color: var(--muted); font-size: 11px; }
  .stat .v { font-size: 18px; font-weight: 700; margin-top: 2px; }
  .stat .v.frontier { color: var(--yellow); }
  .stat .v.ok { color: var(--green); }
  .flow {
    display: flex; gap: 8px; padding: 18px 20px; overflow-x: auto; align-items: stretch;
  }
  .layer {
    flex: 1; min-width: 150px; max-width: 240px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    display: flex; flex-direction: column;
  }
  .layer.dim { opacity: 0.35; }
  .layer.rebuild { border-color: var(--red); box-shadow: 0 0 0 1px var(--red) inset; }
  .layer.reuse { border-color: var(--green); box-shadow: 0 0 0 1px var(--green) inset; }
  .layer-head {
    padding: 8px 12px; font-weight: 700; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; background: var(--panel2);
    border-radius: 10px 10px 0 0;
  }
  .layer-head .badge {
    font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600;
  }
  .badge.reuse { background: rgba(52,211,153,.15); color: var(--green); }
  .badge.rebuild { background: rgba(248,113,113,.15); color: var(--red); }
  .layer-body { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 12px 0; }
  .pkg {
    background: var(--panel2); border-radius: 7px; padding: 7px 9px;
    border-left: 3px solid var(--gray); cursor: pointer; transition: background .15s;
  }
  .pkg:hover { background: #26345a; }
  .pkg .title { font-size: 12px; font-weight: 600; line-height: 1.35; }
  .pkg .meta { display: flex; align-items: center; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .lc { font-size: 11px; color: var(--muted); }
  .claim { font-size: 10px; padding: 1px 6px; border-radius: 9px; font-weight: 600; }
  .claim.none { background: rgba(148,163,184,.15); color: var(--muted); }
  .claim.exploratory { background: rgba(148,163,184,.2); color: #cbd5e1; }
  .claim.engineering_checked { background: rgba(96,165,250,.15); color: var(--blue); }
  .claim.research_validated { background: rgba(52,211,153,.15); color: var(--green); }
  .owner { font-size: 10px; color: var(--muted); margin-top: 3px; }
  .override { font-size: 10px; color: var(--yellow); margin-top: 3px; }
  .legend {
    display: flex; gap: 14px; flex-wrap: wrap; padding: 10px 20px;
    border-top: 1px solid var(--line); color: var(--muted); font-size: 12px;
    position: sticky; bottom: 0; background: var(--panel);
  }
  .legend .item { display: flex; align-items: center; gap: 5px; }
  .tabs { display: flex; gap: 4px; padding: 10px 20px 0; background: var(--panel); border-bottom: 1px solid var(--line); }
  .tab { background: transparent; border: none; border-bottom: 2px solid transparent; padding: 6px 14px; color: var(--muted); cursor: pointer; font-size: 13px; }
  .tab.active { color: var(--text); border-bottom-color: var(--blue); font-weight: 600; }
  #evo { display: none; padding: 16px 20px; }
  .evo-card { background: var(--panel2); border-radius: 8px; padding: 10px 14px; border-left: 3px solid var(--gray); margin-bottom: 8px; }
  .evo-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .evo-status { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  .st-champion { background: rgba(52,211,153,.15); color: var(--green); }
  .st-challenger { background: rgba(251,191,36,.15); color: var(--yellow); }
  .st-rejected { background: rgba(248,113,113,.15); color: var(--red); }
  .st-draft { background: rgba(148,163,184,.15); color: var(--muted); }
  .st-evaluating { background: rgba(96,165,250,.15); color: var(--blue); }
  .st-superseded { background: rgba(148,163,184,.1); color: var(--muted); text-decoration: line-through; }
  .st-rolled_back { background: rgba(251,146,60,.15); color: var(--orange); }
  .evo-id { font-family: monospace; font-size: 12px; }
  .evo-component { color: var(--blue); font-size: 12px; }
  .evo-change { font-size: 13px; margin-top: 6px; }
  .evo-benefit { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .evo-metrics { font-size: 11px; color: var(--muted); margin-top: 6px; font-family: monospace; line-height: 1.5; }
  .evo-cmd { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .evo-cmd code { color: var(--green); }
  #pending { padding: 0 20px 14px; }
  .pending-card { background: var(--panel2); border-radius: 8px; padding: 8px 12px; margin-top: 8px; }
  .pending-card code { color: var(--yellow); }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>🦐 可视化 Agent 工作流</h1>
  <div class="spacer"></div>
  <div class="toolbar">
    <label class="muted">领域</label>
    <select id="domain">
      <option value="">全部</option>
      <option value="sme2">sme2</option>
      <option value="cvfpu">cvfpu</option>
    </select>
    <label class="muted">goal</label>
    <select id="goal">
      <option value="">（无，仅看状态）</option>
      <option value="functional_check">功能检查</option>
      <option value="quick_compare">快速比较</option>
      <option value="exploration">方案探索</option>
      <option value="regression">回归</option>
      <option value="research">研究级归因</option>
    </select>
    <button id="refresh">↻ 刷新</button>
  </div>
</header>
<nav class="tabs">
  <button class="tab active" data-view="flow">工作流</button>
  <button class="tab" data-view="evo">演进中心</button>
</nav>

<div class="summary" id="summary"></div>
<div id="pending"></div>
<div class="flow" id="flow"></div>

<div id="evo">
  <div class="summary" id="evo-summary" style="padding:0 0 14px"></div>
  <div id="evo-list"></div>
</div>

<div class="legend" id="legend">
  <span class="muted">生命周期：</span>
  <span class="item"><span class="dot" style="background:#34d399"></span>passed</span>
  <span class="item"><span class="dot" style="background:#94a3b8"></span>draft/ready</span>
  <span class="item"><span class="dot" style="background:#60a5fa"></span>running</span>
  <span class="item"><span class="dot" style="background:#fbbf24"></span>needs_decision</span>
  <span class="item"><span class="dot" style="background:#a78bfa"></span>validating</span>
  <span class="item"><span class="dot" style="background:#f87171"></span>failed</span>
  <span class="item"><span class="dot" style="background:#fb923c"></span>unresolved</span>
  <span class="item"><span class="dot" style="background:#64748b"></span>invalidated/superseded</span>
  <span class="muted" style="margin-left:12px">路径：</span>
  <span class="item"><span class="badge reuse">复用</span>绿框</span>
  <span class="item"><span class="badge rebuild">重建</span>红框</span>
</div>

<script>
const LC = {
  passed: '#34d399', draft: '#94a3b8', ready: '#94a3b8', running: '#60a5fa',
  needs_decision: '#fbbf24', validating: '#a78bfa', failed: '#f87171',
  unresolved: '#fb923c', rejected: '#c0392b', invalidated: '#64748b',
  superseded: '#64748b', unknown: '#64748b',
};
const LC_LABEL = {
  passed: 'passed', draft: 'draft', ready: 'ready', running: 'running',
  needs_decision: 'needs_decision', validating: 'validating', failed: 'failed',
  unresolved: 'unresolved', rejected: 'rejected', invalidated: 'invalidated',
  superseded: 'superseded', unknown: 'unknown',
};
const LAYERS = ['L1','L2','L3','L4','L5','L6','L7','L8'];
const LAYER_NAME = {L1:'观测',L2:'归因',L3:'方案',L4:'契约',L5:'RTL',L6:'集成',L7:'实验',L8:'结论'};

let state = null;

async function load() {
  const domain = document.getElementById('domain').value;
  const goal = document.getElementById('goal').value;
  const dq = domain ? `?domain=${domain}` : '';
  try {
    const resp = await fetch(`/api/state${dq}`);
    state = await resp.json();
    if (state.error) { renderError(state.error); return; }
  } catch (e) { renderError('无法连接 /api/state：' + e); return; }

  renderSummary();
  renderPending();

  let flow = null;
  if (goal) {
    try {
      const gq = `?goal=${goal}` + (domain ? `&domain=${domain}` : '');
      flow = await (await fetch(`/api/recommend-flow${gq}`)).json();
    } catch (e) { flow = {error: String(e)}; }
  }
  renderFlow(flow);
}

function renderError(msg) {
  document.getElementById('summary').innerHTML = `<div class="stat"><span class="v" style="color:#f87171">⚠ ${esc(msg)}</span></div>`;
  document.getElementById('flow').innerHTML = '';
}

function renderSummary() {
  const s = state.summary || {};
  const frontier = s.frontier || 'all-passed';
  const fcolor = (frontier === 'all-passed' ? 'ok' : 'frontier');
  // store 徽章据实显示：服务端不设 WF_ROOT 时连的就是真实 store
  const isolated = state.store_isolated === true;
  document.getElementById('summary').innerHTML = `
    <div class="stat"><div class="k">领域</div><div class="v">${esc(s.domain || '*')}</div></div>
    <div class="stat"><div class="k">层包总数</div><div class="v">${Number(s.total_packages) || 0}</div></div>
    <div class="stat"><div class="k">推进前沿</div><div class="v ${fcolor}">${esc(frontier)}</div></div>
    <div class="stat"><div class="k">待批决策</div><div class="v">${Number(s.pending_decisions) || 0}</div></div>
    <div class="stat"><div class="k">归档</div><div class="v">${Number(s.archived) || 0}</div></div>
    <div class="stat"><div class="k">DAG 节点/边</div><div class="v">${(state.dag?.nodes?.length ?? 0)}/${(state.dag?.edges?.length ?? 0)}</div></div>
    <div class="stat"><div class="k">store 哈希</div><div class="v" style="font-size:11px;font-family:monospace">${esc((state.store_env_hash||'').slice(0,12))}…</div></div>
    <div class="stat"><div class="k">store</div><div class="v" style="font-size:12px;color:${isolated ? 'var(--green)' : 'var(--yellow)'}">${isolated ? '隔离副本' : '真实 store'}</div><div class="k" title="${esc(state.store_root || '')}">${esc(state.store_root || '（旧版服务端未提供）')}</div></div>
  `;
}

function renderPending() {
  const pd = state.pending_decisions || [];
  const el = document.getElementById('pending');
  if (!pd.length) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="pending-card"><b>待批决策 ${pd.length} 条</b>` +
    pd.map(d => `<div style="margin-top:4px"><code>${esc(d.decision_id)}</code> → ${esc((d.package_ids||[]).join(', ')) || '未挂包'} <span class="muted">(${esc(d.decision_type || '')})</span><br><span class="muted">${esc(d.rationale||'')}</span></div>`).join('') +
    `</div>`;
}

const slug = id => String(id || '').replace(/^PKG-L\d+d?-[^-]+-/, '');

function renderFlow(flow) {
  const layers = state.layers || {};
  const el = document.getElementById('flow');
  const flowByLayer = {};
  if (flow && !flow.error) {
    for (const f of flow.flow) flowByLayer[f.layer] = f;
  }
  el.innerHTML = LAYERS.map(L => {
    const pkgs = layers[L]?.packages || [];
    const f = flowByLayer[L];
    let cls = 'layer';
    let badge = '';
    if (flow && !flow.error) {
      if (f && f.action === 'reuse') { cls += ' reuse'; badge = `<span class="badge reuse">复用 ${esc(slug(f.package_id))}</span>`; }
      else if (f && f.action === 'rebuild') { cls += ' rebuild'; badge = `<span class="badge rebuild">重建</span>`; }
      else { cls += ' dim'; badge = `<span class="badge" style="opacity:.5">跳过</span>`; }
    }
    const body = pkgs.length
      ? pkgs.map(p => pkgCard(p)).join('')
      : `<div class="empty">无包</div>`;
    return `<div class="${cls}">
      <div class="layer-head">${L} · ${LAYER_NAME[L] || ''} ${badge}</div>
      <div class="layer-body">${body}</div>
    </div>`;
  }).join('');
}

function pkgCard(p) {
  const color = LC[p.lifecycle] || LC.unknown;
  const lc = LC_LABEL[p.lifecycle] || p.lifecycle || 'unknown';
  // 结论等级既进 class 又是文本：只认已知的三个值，其余一律按未定级处理
  const claim = CLAIM_LEVELS.includes(p.claim_level) ? p.claim_level : 'none';
  const claimLabel = claim === 'none' ? '未定级' : claim.replace('_',' ');
  const override = p.flow_policy_overrides?.length
    ? `<div class="override">⚠ ${Number(p.flow_policy_overrides.length)} 处门禁覆盖</div>` : '';
  const title = (p.title || p.package_id || '').slice(0, 80);
  return `<div class="pkg" style="border-left-color:${color}" title="${p.package_id}">
    <div class="title">${esc(title)}</div>
    <div class="meta"><span class="dot" style="background:${color}"></span>
      <span class="lc">${esc(lc)}</span>
      <span class="claim ${claim}">${esc(claimLabel)}</span></div>
    <div class="owner">${esc(p.package_id||'')}</div>
    <div class="owner">owner: ${esc(p.owner_agent || '待认领')}</div>
    ${override}
  </div>`;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

// 结论等级的合法值（用作 class 前先校验）
const CLAIM_LEVELS = ['exploratory', 'engineering_checked', 'research_validated'];

document.getElementById('refresh').addEventListener('click', load);
document.getElementById('domain').addEventListener('change', load);
document.getElementById('goal').addEventListener('change', load);

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  const view = t.dataset.view;
  document.getElementById('flow').style.display = view === 'flow' ? 'flex' : 'none';
  document.getElementById('evo').style.display = view === 'evo' ? 'block' : 'none';
  document.getElementById('legend').style.display = view === 'flow' ? 'flex' : 'none';
  if (view === 'evo') loadEvo();
}));

const EVO_COLOR = { champion:'#34d399', challenger:'#fbbf24', rejected:'#f87171',
  draft:'#94a3b8', evaluating:'#60a5fa', superseded:'#64748b', rolled_back:'#fb923c' };

async function loadEvo() {
  let evo;
  try {
    evo = await (await fetch('/api/evo-state')).json();
  } catch (e) {
    document.getElementById('evo-list').innerHTML = '<div class="muted">无法连接 /api/evo-state</div>';
    return;
  }
  if (evo.error) { document.getElementById('evo-list').innerHTML = '<div class="muted">'+esc(evo.error)+'</div>'; return; }
  renderEvo(evo);
}

function renderEvo(evo) {
  const s = evo.summary || {};
  const num = v => Number(v) || 0;
  document.getElementById('evo-summary').innerHTML = `
    <div class="stat"><div class="k">候选总数</div><div class="v">${num(s.total)}</div></div>
    <div class="stat"><div class="k">Champion</div><div class="v ok">${num(s.champions)}</div></div>
    <div class="stat"><div class="k">Challenger</div><div class="v">${num(s.challengers)}</div></div>
    <div class="stat"><div class="k">Rejected</div><div class="v" style="color:#f87171">${num(s.rejected)}</div></div>
    <div class="stat"><div class="k">已回滚</div><div class="v" style="color:#fb923c">${num(s.rolled_back)}</div></div>`;
  const list = evo.evolutions || [];
  if (!list.length) {
    document.getElementById('evo-list').innerHTML = '<div class="muted">（无演进候选。用 <code>wf evo-new</code> 创建第一个）</div>';
    return;
  }
  document.getElementById('evo-list').innerHTML = list.map(evoCard).join('');
}

const EVO_ID = /^EVO-[A-Za-z0-9._-]+$/;
function evoCard(e) {
  // 状态值既进 class 又进文本：只认已知状态；候选 ID 不合规就转义显示且不拼进命令
  const status = Object.prototype.hasOwnProperty.call(EVO_COLOR, e.status) ? e.status : 'draft';
  const color = EVO_COLOR[status];
  const id = EVO_ID.test(e.candidate_id || '') ? e.candidate_id : null;
  let metrics = '';
  if (e.champion_metrics || e.challenger_metrics) {
    metrics = `<div class="evo-metrics">Champion: ${esc(JSON.stringify(e.champion_metrics ?? '-'))}<br>Challenger: ${esc(JSON.stringify(e.challenger_metrics ?? '-'))}</div>`;
  }
  let cmd = '';
  if (id && status === 'challenger') cmd = `<div class="evo-cmd">晋级：<code>wf evo-promote --candidate ${id}</code></div>`;
  if (id && status === 'champion') cmd = `<div class="evo-cmd">回滚：<code>wf evo-rollback --candidate ${id}</code></div>`;
  return `<div class="evo-card" style="border-left-color:${color}">
    <div class="evo-head">
      <span class="evo-status st-${status}">${esc(status)}</span>
      <span class="evo-id">${esc(e.candidate_id || '')}</span>
      <span class="evo-component">[${esc(e.target_component || '')}]</span>
      <span class="muted">${esc(e.change_type||'')}</span>
    </div>
    <div class="evo-change">${esc(e.change_set||'')}</div>
    ${e.expected_benefit ? `<div class="evo-benefit">预期收益：${esc(e.expected_benefit)}</div>` : ''}
    ${metrics}${cmd}
  </div>`;
}

load();
</script>
</body>
</html>
